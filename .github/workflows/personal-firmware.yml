name: Personal firmware

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      build_kind:
        description: "Which upstream state to build"
        required: false
        type: choice
        default: "auto"
        options:
          - auto
          - ci
          - release
      tracker_ref:
        description: "Tracker upstream ref"
        required: false
        default: "dev"
      receiver_ref:
        description: "Receiver upstream ref"
        required: false
        default: "dev"
      release_tag:
        description: "Release tag to use when manually overriding"
        required: false
        default: ""
  push:
    branches:
      - personal/auto-build
    tags:
      - "personal-*"

concurrency:
  group: personal-firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ZEPHYR_SDK_VERSION: "0.17.4"
  TRACKER_REPO: "https://github.com/jitingcn/SlimeVR-Tracker-nRF.git"
  RECEIVER_REPO: "https://github.com/jitingcn/SlimeVR-Tracker-nRF-Receiver.git"
  TRACKER_BOARD: "promicro_uf2/nrf52840/default_spi"
  TRACKER_FILENAME: "SlimeNRF_ProMicro_Tracker_SPI_NoIdleWOM"
  RECEIVER_BOARD: "aerorx_r1_uf2/nrf52840"
  RECEIVER_FILENAME: "AeroRX_R1_Receiver"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      build_kind: ${{ steps.plan.outputs.build_kind }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_name: ${{ steps.plan.outputs.release_name }}
      tracker_ref: ${{ steps.plan.outputs.tracker_ref }}
      receiver_ref: ${{ steps.plan.outputs.receiver_ref }}
      tracker_commit: ${{ steps.plan.outputs.tracker_commit }}
      receiver_commit: ${{ steps.plan.outputs.receiver_commit }}
    steps:
      - name: Checkout personal config
        uses: actions/checkout@v6

      - name: Plan upstream build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_KIND_INPUT: ${{ inputs.build_kind || 'auto' }}
          TRACKER_REF_INPUT: ${{ inputs.tracker_ref || 'dev' }}
          RECEIVER_REF_INPUT: ${{ inputs.receiver_ref || 'dev' }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          sanitize() {
            echo "$1" | tr '/: ' '---' | tr -cd 'A-Za-z0-9._-'
          }

          tag_exists() {
            git ls-remote --exit-code --tags origin "refs/tags/$1" >/dev/null 2>&1
          }

          latest_release_tag() {
            gh api "repos/$1/releases/latest" --jq '.tag_name' 2>/dev/null || true
          }

          resolve_commit() {
            git ls-remote "$1" "$2" | awk 'NR == 1 {print $1}'
          }

          tracker_dev_ref="$TRACKER_REF_INPUT"
          receiver_dev_ref="$RECEIVER_REF_INPUT"
          tracker_dev_commit="$(resolve_commit "$TRACKER_REPO" "refs/heads/$tracker_dev_ref")"
          receiver_dev_commit="$(resolve_commit "$RECEIVER_REPO" "refs/heads/$receiver_dev_ref")"
          if [ -z "$tracker_dev_commit" ] || [ -z "$receiver_dev_commit" ]; then
            echo "Failed to resolve upstream dev refs" >&2
            exit 1
          fi

          tracker_release_tag="$(latest_release_tag jitingcn/SlimeVR-Tracker-nRF)"
          receiver_release_tag="$(latest_release_tag jitingcn/SlimeVR-Tracker-nRF-Receiver)"

          choose_ci() {
            build_kind="ci"
            tracker_ref="$tracker_dev_ref"
            receiver_ref="$receiver_dev_ref"
            tracker_commit="$tracker_dev_commit"
            receiver_commit="$receiver_dev_commit"
            release_tag="personal-ci-${tracker_dev_commit:0:7}-${receiver_dev_commit:0:7}"
            release_name="Personal CI ${tracker_dev_commit:0:7}/${receiver_dev_commit:0:7}"
          }

          choose_release() {
            build_kind="release"
            tracker_ref="${tracker_release_tag:-$tracker_dev_ref}"
            receiver_ref="${receiver_release_tag:-$receiver_dev_ref}"
            tracker_commit="$(resolve_commit "$TRACKER_REPO" "refs/tags/$tracker_ref")"
            receiver_commit="$(resolve_commit "$RECEIVER_REPO" "refs/tags/$receiver_ref")"
            if [ -z "$tracker_commit" ]; then
              tracker_commit="$tracker_dev_commit"
            fi
            if [ -z "$receiver_commit" ]; then
              receiver_commit="$receiver_dev_commit"
            fi
            if [ -n "$tracker_release_tag$receiver_release_tag" ]; then
              release_tag="personal-release-t$(sanitize "${tracker_release_tag:-dev}")-r$(sanitize "${receiver_release_tag:-dev}")"
            else
              release_tag="personal-release-dev-${tracker_dev_commit:0:7}-${receiver_dev_commit:0:7}"
            fi
            release_name="Personal upstream release tracker ${tracker_release_tag:-dev}, receiver ${receiver_release_tag:-dev}"
          }

          kind="$BUILD_KIND_INPUT"
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            choose_ci
            release_tag="$RELEASE_TAG_INPUT"
            release_name="Personal manual $RELEASE_TAG_INPUT"
          elif [ "$kind" = "ci" ]; then
            choose_ci
          elif [ "$kind" = "release" ]; then
            choose_release
          else
            if [ -n "$tracker_release_tag$receiver_release_tag" ]; then
              choose_release
              if tag_exists "$release_tag"; then
                choose_ci
              fi
            else
              choose_ci
            fi
          fi

          if tag_exists "$release_tag"; then
            should_build=false
            echo "Release tag already exists: $release_tag"
          else
            should_build=true
            echo "Will build $build_kind release: $release_tag"
          fi

          {
            echo "should_build=$should_build"
            echo "build_kind=$build_kind"
            echo "release_tag=$release_tag"
            echo "release_name=$release_name"
            echo "tracker_ref=$tracker_ref"
            echo "receiver_ref=$receiver_ref"
            echo "tracker_commit=$tracker_commit"
            echo "receiver_commit=$receiver_commit"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      TRACKER_REF: ${{ needs.plan.outputs.tracker_ref }}
      RECEIVER_REF: ${{ needs.plan.outputs.receiver_ref }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      RELEASE_NAME: ${{ needs.plan.outputs.release_name }}
      BUILD_KIND: ${{ needs.plan.outputs.build_kind }}
      TRACKER_COMMIT: ${{ needs.plan.outputs.tracker_commit }}
      RECEIVER_COMMIT: ${{ needs.plan.outputs.receiver_commit }}

    steps:
      - name: Checkout personal config
        uses: actions/checkout@v6

      - name: Cache and install apt dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget
            python3-dev python3-pip python3-setuptools python3-tk python3-wheel python3-venv
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1 zip
          version: 1.0

      - name: Cache Zephyr SDK
        id: cache-sdk
        uses: actions/cache@v5
        with:
          path: ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}

      - name: Install Zephyr SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${{ env.ZEPHYR_SDK_VERSION }}/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}_linux-x86_64_minimal.tar.xz -C ~/
          ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}/setup.sh -c -t arm-zephyr-eabi

      - name: Register Zephyr SDK
        run: |
          ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}/setup.sh -c -t arm-zephyr-eabi

      - name: Cache Python venv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: ~/.venv
          key: personal-venv-${{ env.ZEPHYR_SDK_VERSION }}

      - name: Setup Python venv and west
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python3 -m venv ~/.venv
          ~/.venv/bin/pip install west ninja

      - name: Clone upstream repositories
        run: |
          set -euo pipefail
          mkdir -p zephyr-workspace
          cd zephyr-workspace
          echo "Tracker ref: $TRACKER_REF"
          echo "Tracker commit: $TRACKER_COMMIT"
          echo "Receiver ref: $RECEIVER_REF"
          echo "Receiver commit: $RECEIVER_COMMIT"

          git clone --filter=blob:none --no-checkout "$TRACKER_REPO" tracker
          git -C tracker fetch --depth=1 origin "$TRACKER_COMMIT"
          git -C tracker checkout --detach "$TRACKER_COMMIT"

          git clone --filter=blob:none --no-checkout "$RECEIVER_REPO" receiver
          git -C receiver fetch --depth=1 origin "$RECEIVER_COMMIT"
          git -C receiver checkout --detach "$RECEIVER_COMMIT"

      - name: Apply tracker no-idle-WOM patch
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_no_idle_wom.py" zephyr-workspace/tracker

      - name: Cache West workspace
        uses: actions/cache@v5
        with:
          path: |
            zephyr-workspace/.west
            zephyr-workspace/zephyr
            zephyr-workspace/nrf
            zephyr-workspace/modules
            zephyr-workspace/nrfxlib
            zephyr-workspace/bootloader
            zephyr-workspace/tools
          key: personal-west-${{ env.ZEPHYR_SDK_VERSION }}-${{ hashFiles('zephyr-workspace/tracker/west.yml') }}

      - name: Initialize West workspace
        run: |
          echo "$HOME/.venv/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.venv/bin:$PATH"
          cd zephyr-workspace
          if [ ! -d ".west" ]; then
            west init -l tracker
          fi
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Install Zephyr Python requirements
        run: |
          ~/.venv/bin/pip install -r zephyr-workspace/zephyr/scripts/requirements.txt

      - name: Build personal tracker firmware
        run: |
          cd zephyr-workspace
          rm -rf tracker/build
          mkdir -p Releases
          west build \
            --board "$TRACKER_BOARD" \
            --pristine=always tracker \
            --build-dir tracker/build \
            -- \
            -DNCS_TOOLCHAIN_VERSION=NONE \
            -DBOARD_ROOT=../tracker \
            -DEXTRA_CONF_FILE=no_idle_wom.conf

          cp "tracker/build/tracker/zephyr/zephyr.uf2" "Releases/${TRACKER_FILENAME}.uf2"

      - name: Build personal receiver firmware
        run: |
          cd zephyr-workspace
          rm -rf receiver/build
          mkdir -p Releases
          west build \
            --board "$RECEIVER_BOARD" \
            --pristine=always receiver \
            --build-dir receiver/build \
            -- \
            -DNCS_TOOLCHAIN_VERSION=NONE \
            -DBOARD_ROOT=../receiver

          cp "receiver/build/receiver/zephyr/zephyr.uf2" "Releases/${RECEIVER_FILENAME}.uf2"

      - name: Write source metadata
        run: |
          {
            echo "tracker_repo=$TRACKER_REPO"
            echo "tracker_ref=$TRACKER_REF"
            echo "tracker_commit=$(git -C zephyr-workspace/tracker rev-parse HEAD)"
            echo "receiver_repo=$RECEIVER_REPO"
            echo "receiver_ref=$RECEIVER_REF"
            echo "receiver_commit=$(git -C zephyr-workspace/receiver rev-parse HEAD)"
            echo "build_kind=$BUILD_KIND"
            echo "release_tag=$RELEASE_TAG"
            echo "workflow_commit=$GITHUB_SHA"
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            date -u +"built_at_utc=%Y-%m-%dT%H:%M:%SZ"
          } > zephyr-workspace/Releases/SOURCES.txt

      - name: Package firmware
        run: |
          cd zephyr-workspace/Releases
          ls -la
          zip -9 -r "$GITHUB_WORKSPACE/personal-firmware.zip" .

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: personal-firmware
          if-no-files-found: error
          path: |
            zephyr-workspace/Releases/*.uf2
            zephyr-workspace/Releases/SOURCES.txt
            personal-firmware.zip

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          fail_on_unmatched_files: true
          files: |
            zephyr-workspace/Releases/*.uf2
            zephyr-workspace/Releases/SOURCES.txt

      - name: Check mail secrets
        id: mail
        if: always()
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -n "$MAIL_SERVER" ] && [ -n "$MAIL_PORT" ] && [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ] && [ -n "$MAIL_FROM" ] && [ -n "$MAIL_TO" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send success email
        if: ${{ success() && steps.mail.outputs.enabled == 'true' }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "SlimeVR personal ${{ env.BUILD_KIND }} firmware build succeeded"
          body: |
            The personal firmware build succeeded.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
            Build kind: ${{ env.BUILD_KIND }}
            Tracker: ${{ env.TRACKER_BOARD }}
            Receiver: ${{ env.RECEIVER_BOARD }}
          attachments: personal-firmware.zip

      - name: Send failure email
        if: ${{ failure() && steps.mail.outputs.enabled == 'true' }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "SlimeVR personal ${{ env.BUILD_KIND }} firmware build failed"
          body: |
            The personal firmware build failed.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Build kind: ${{ env.BUILD_KIND }}
            Tracker: ${{ env.TRACKER_BOARD }}
            Receiver: ${{ env.RECEIVER_BOARD }}
